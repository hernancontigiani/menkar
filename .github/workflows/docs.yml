# The public documentation site: built and checked from site/, then published to GitHub Pages.
# Run by hand only until the first release.
name: docs

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a run already publishing finishes rather than leave Pages half-written.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Astro needs 22.23.4 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.x
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      # Not `npm run site:check -- --release`: the root script's inner npm takes --release as its own
      # option and drops it.
      - run: npm --prefix site run check -- --release
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
