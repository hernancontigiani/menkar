appId: io.github.hernancontigiani.Menkar
productName: Menkar
executableName: menkar
copyright: Copyright © 2026 Hernan Contigiani
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
npmRebuild: true
# Nothing leaves the machine: no update feed, so no app-update.yml in the package.
publish: null
linux:
  target:
    - target: deb
      arch: [x64]
  category: Development
  icon: build/icons
  synopsis: Several Claude Code sessions at once, each in a real terminal
  syncDesktopName: true
  desktop:
    entry:
      Name: Menkar
deb:
  packageCategory: devel
  # electron-builder's own list plus ALSA: Electron links libasound.so.2, and without it the app
  # dies at start on a system that has no desktop sound stack. Ubuntu 24.04 renamed it libasound2t64.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
rpm:
  # electron-builder's own list plus ALSA: Electron links libasound.so.2, and without it the app
  # dies at start on a system that has no desktop sound stack.
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - alsa-lib
  # An .rpm owns only the files fpm lists, so `dnf remove` left /opt/Menkar's directories behind,
  # empty; this marks the folder and everything under it as the package's.
  fpm: ['--directories', '/opt/Menkar']
# Menkar's skills plugin: `claude --plugin-dir` reads it, and cannot read inside app.asar.
extraResources:
  - from: plugin
    to: plugin
